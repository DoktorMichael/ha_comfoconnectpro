  <text x="88" y="168" class="t-pan">GARAGE / HEIZRAUM</text>
  <rect x="1015" y="115" width="1505" height="1250" class="pan" rx="22"/>
  <text x="1048" y="168" class="t-pan">HAUS W11</text>

