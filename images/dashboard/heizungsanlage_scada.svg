<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pufferGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a1e"/>
      <stop offset="0.18" stop-color="#ff7a3c"/>
      <stop offset="0.36" stop-color="#f5a623"/>
      <stop offset="0.5" stop-color="#b06a30"/>
      <stop offset="0.62" stop-color="#5a6ea8"/>
      <stop offset="0.8" stop-color="#35619b"/>
      <stop offset="1" stop-color="#2b57a0"/>
    </linearGradient>
    <linearGradient id="boilerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b545"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#a34f06"/>
    </linearGradient>
    <radialGradient id="mixerGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030e1c" stop-opacity="0.7"/>
    </linearGradient>
    <marker id="aVl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff7846" fill-opacity="0.9"/>
    </marker>
    <marker id="aRl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4f8cff" fill-opacity="0.9"/>
    </marker>
    <style>
      .pg{stroke-width:14;fill:none;stroke-opacity:0.13;stroke-linecap:round;stroke-linejoin:round}
      .pc{stroke-width:5.5;fill:none;stroke-opacity:0.8;stroke-linecap:round;stroke-linejoin:round}
      .vl{stroke:#ff7846}
      .rl{stroke:#4f8cff}
      .pan{fill:#0a1a2c;fill-opacity:0.55;stroke:#12283f;stroke-width:1.5}
      .field{fill:#041325;stroke:#2a3d55;stroke-width:1.5}
      .t-title{font-size:26px;font-weight:700;fill:#f2f6fb;letter-spacing:4px}
      .t-pan{font-size:19px;font-weight:700;fill:#e8eff8;letter-spacing:4px}
      .t-hdr{font-size:16px;font-weight:700;fill:#dce8f6;letter-spacing:2px}
      .t-row{font-size:17px;fill:#dbe6f3}
      .t-lbl{font-size:14px;fill:#c8d8ea}
      .t-tag{font-size:13px;font-weight:700;fill:#eaf2fc;letter-spacing:1.5px}
      .t-sm{font-size:12.5px;fill:#7f93aa;letter-spacing:2px}
      .t-cy{font-size:15px;font-weight:700;fill:#ffffff;letter-spacing:3px}
