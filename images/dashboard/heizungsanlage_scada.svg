<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#0c1c33" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="pufferGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a1e"/>
      <stop offset="0.16" stop-color="#ff7a3c"/>
      <stop offset="0.32" stop-color="#f5a623"/>
      <stop offset="0.46" stop-color="#d18f24"/>
      <stop offset="0.56" stop-color="#5a6ea8"/>
      <stop offset="0.74" stop-color="#35569b"/>
      <stop offset="1" stop-color="#24406f"/>
    </linearGradient>
    <linearGradient id="boilerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b545"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#a34f06"/>
    </linearGradient>
    <radialGradient id="mixerGrad" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <marker id="aVl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff7846" fill-opacity="0.9"/>
    </marker>
    <marker id="aRl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4f8cff" fill-opacity="0.9"/>
    </marker>
    <style>
      .pglow{stroke-width:18;fill:none;stroke-opacity:0.10;stroke-linecap:round;stroke-linejoin:round}
      .pcore{stroke-width:7;fill:none;stroke-opacity:0.72;stroke-linecap:round;stroke-linejoin:round}
      .vl{stroke:#ff7846}
      .rl{stroke:#4f8cff}
      .pan{fill:#121b2a;stroke:#26374d;stroke-width:2}
      .pan2{fill:#0d1522;stroke:#26374d;stroke-width:1.5}
      .field{fill:#0b1422;stroke:#34455f;stroke-width:1.5}
      .t-title{font-size:28px;font-weight:700;fill:#eaf1fa;letter-spacing:4px}
      .t-pan{font-size:20px;font-weight:700;fill:#ffffff;letter-spacing:4px}
      .t-hdr{font-size:18px;font-weight:700;fill:#dce8f6;letter-spacing:2px}
      .t-row{font-size:17px;fill:#dbe6f3}
      .t-lbl{font-size:14px;fill:#cfe0f2}
      .t-tag{font-size:14px;font-weight:700;fill:#eaf2fc;letter-spacing:1px}
      .t-sm{font-size:13px;fill:#8fa3bd;letter-spacing:2px}
      .t-cy{font-size:16px;font-weight:700;fill:#ffffff;letter-spacing:3px}
